<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Capacitaciones en seguridad · RS Consultora</title>
<meta name="description" content="Capacitación de Higiene y Seguridad: Fatiga y Conducción Segura – Vehículos livianos y pesados. RS Consultora · Lic. Roberto Seguin.">
<meta name="theme-color" content="#0f1216">
<meta property="og:title" content="Fatiga y Conducción Segura · RS Consultora">
<meta property="og:description" content="Capacitación interactiva de RS Consultora, dictada por el Lic. Roberto Seguin.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div class="page">
  <header class="topbar">
    <div class="brand"><span id="brandMark"></span><div><strong id="brandName">RS CONSULTORA</strong><small>Higiene y Seguridad</small></div></div>
    <div class="top-actions"></div>
  </header>
  <main class="page-main" id="home"></main>
  <footer class="site-foot"><span id="footTxt"></span><span><a href="verificar.html">Verificar constancia</a> · <a href="actividades.html">Actividades</a> · <a href="afiche.html">Afiche</a> · <a href="referencias.html">Referencias</a> · <a href="privacidad.html">Privacidad</a> · <a href="login.html">Ingreso del capacitador</a></span></footer>
</div>
<script src="assets/qrcode.js"></script>
<script src="assets/config.js"></script>
<script src="assets/content.js"></script>
<script src="assets/common.js"></script>
<script>
'use strict';
(function renderHome(){
  initBrand();
  const c = CONFIG.consultora, url = evalUrl(), sesion = /(?:^|;\s*)rs_at=/.test(document.cookie);
  $('#home').innerHTML = `
  <section class="hero">
    <div>
      <span class="cover-tag">${ic('shield')} ${esc(c.nombre)} · Higiene y Seguridad</span>
      <h1 class="cover-title">CAPACITACIONES<br><span>EN SEGURIDAD</span></h1>
      <p class="cover-sub">Curso disponible: Fatiga y conducción segura · Vehículos livianos y pesados</p>
      <p class="muted">Dictado presencial con presentación interactiva, actividades y evaluación individual desde el celular de cada participante.</p>
      ${instructorCard('Dicta la capacitación')}
    </div>
    <div class="cover-art">${ART_ROAD}</div>
  </section>
  <div class="grid g4">
    <a class="mode-card" href="${sesion ? 'cursos.html' : 'login.html'}">${ic('lock','xl')}<p class="eyebrow">Para el capacitador</p><h2>${sesion ? 'Mis cursos' : 'Ingresar'}</h2><p class="muted">Presentaciones, videos, desafío en vivo, guía y Administración. Es contenido privado: se entra con usuario y contraseña.</p><span class="go">${sesion ? 'Ir a mis cursos' : 'Ingresar'} ${ic('arrow')}</span></a>
    <a class="mode-card" href="evaluacion.html">${ic('clipboard','xl')}<p class="eyebrow">Para cada participante</p><h2>Evaluación</h2><p class="muted">Se abre con el QR que muestra el capacitador. Identificación, ${CONTENT.quiz.length} preguntas con explicación, resultado y constancia.</p><span class="go">Rendir evaluación ${ic('arrow')}</span></a>
    <a class="mode-card" href="verificar.html">${ic('award','xl')}<p class="eyebrow">Para empresas y controles</p><h2>Verificar constancia</h2><p class="muted">Comprobá con el código o el QR impreso que una constancia es auténtica.</p><span class="go">Verificar ${ic('arrow')}</span></a>
    <div class="mode-card" style="align-items:center;text-align:center"><p class="eyebrow">Acceso rápido</p><div class="qr-box" style="width:170px">${qrSVG(url)}</div><p class="sm muted">Escaneá para abrir la evaluación</p></div>
  </div>`;
  $('#footTxt').textContent = `${c.nombre} · ${capacitador()}`;
})();
</script>
</body>
</html>
