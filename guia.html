<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guía del capacitador · RS Consultora</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/informe.css">
<style>
.g-tab{width:100%;border-collapse:collapse;font-size:9.6pt}
.g-tab td,.g-tab th{border-bottom:1px solid var(--line);padding:1.9mm 2mm;vertical-align:top;text-align:left}
.g-tab th{font-size:8.5pt;color:var(--muted);font-weight:600;border-bottom:1.5px solid #c8ced6}
.g-tab span{color:var(--muted)}
.g-t{white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:700;width:24mm}
.g-m{white-space:nowrap;text-align:right!important;color:var(--muted);width:16mm}
.g-n{width:9mm;font-weight:800;color:#b07a00}
.g-pan td{padding:.7mm 1.6mm;font-size:8.2pt;line-height:1.24}
.g-pan .g-t{width:11mm}
.g-pan td:nth-child(3){width:47%}
.g-pan i{color:#3d4652}
.g-check{display:grid;grid-template-columns:1fr 1fr;gap:2mm 8mm}
.g-check ul{list-style:none;margin:0;padding:0;font-size:9.2pt}
.g-check li{display:flex;gap:2.5mm;margin:1.1mm 0;line-height:1.3}
.g-check .box{flex:none;width:3.4mm;height:3.4mm;border:1.2px solid #555;border-radius:.6mm;margin-top:.5mm}
@media screen and (max-width:820px){ .g-check{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="toolbar">
  <b>Guía del capacitador · RS Consultora</b>
  <div class="tb-actions">
    <a href="admin.html"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg> Administración</a>
    <button id="tbPrint" class="primary"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg> Imprimir / Guardar PDF</button>
  </div>
</div>
<main id="report"></main>
<script src="assets/config.js"></script>
<script src="assets/content.js"></script>
<script src="assets/common.js"></script>
<script src="assets/guia.js"></script>
</body>
</html>
